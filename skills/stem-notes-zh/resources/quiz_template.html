<body>
  <div class="page-shell">
    <div class="quiz-header">
      <div class="quiz-title">📝 随堂变式测验 · 离线自测与错题本</div>

    <!-- 1. 切题导航状态机 Radio -->

    <!-- 2. 每题作答状态机 Radio（A/B/C/D + u=此题不会） -->
    <input type="radio" name="q1" id="q1-a" class="ans-radio is-right">
    <input type="radio" name="q1" id="q1-b" class="ans-radio is-wrong">

    <div class="quiz-wrap">

        </div>
      </div>

      <div class="q-panel" id="panel-q1">
        <div class="q-meta">
          <span class="q-num">第 1 / 1 题</span>
          <span class="q-tag">示例考点 · 偏置电路分析</span>
        </div>
        <div class="q-body-row">
          <div class="q-stem">
            在图示分压式偏置共射放大电路中，若忽略基极分流影响，发射极电阻 <i>R</i><sub>e</sub> 引入的直流负反馈主要作用是什么？
          </div>
          <div class="q-fig">
            <svg viewBox="0 0 260 110">
              <line x1="130" y1="14" x2="130" y2="34" stroke="#e2e8f0" stroke-width="1.8"/>
              <rect x="123" y="34" width="14" height="34" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
              <text x="145" y="55" fill="#38bdf8" font-size="12" font-family="Times New Roman, serif" font-style="italic">R<tspan dy="3" font-size="9" font-style="normal">e</tspan></text>
              <line x1="130" y1="68" x2="130" y2="90" stroke="#e2e8f0" stroke-width="1.8"/>
              <line x1="118" y1="90" x2="142" y2="90" stroke="#e2e8f0" stroke-width="1.8"/>
              <line x1="122" y1="95" x2="138" y2="95" stroke="#e2e8f0" stroke-width="1.8"/>
              <line x1="126" y1="100" x2="134" y2="100" stroke="#e2e8f0" stroke-width="1.8"/>
            </svg>
          </div>
        </div>
        <div class="opts-list">

              </div>
              <span class="opt-badge">✓ 正确</span>
            </div>
            <div class="opt-exp">✅ <b>解析</b>：温度升高使 <i>I</i><sub>CQ</sub> 增大时，<i>I</i><sub>EQ</sub><i>R</i><sub>e</sub> 抬升，进而压低 <i>U</i><sub>BEQ</sub>，抑制 <i>I</i><sub>CQ</sub> 漂移。</div>
          </label>
          <label for="q1-b" class="opt-card opt-q1-b opt-wrong">
            <div class="opt-head">
              <div class="opt-left">

              </div>

            </div>
            <div class="opt-exp">❌ <b>诊断</b>：未加旁路电容时 <i>R</i><sub>e</sub> 会引入交流负反馈，反而降低电压放大倍数。</div>

              </div>
              <span class="opt-badge">✕ 误选</span>
            </div>
            <div class="opt-exp">❌ <b>诊断</b>：串联负反馈电阻 <i>R</i><sub>e</sub> 折算到基极会增大而非降低输入电阻。</div>
          </label>
          <label for="q1-d" class="opt-card opt-q1-d opt-wrong">
            <div class="opt-head">
              <div class="opt-left">
                <span class="opt-letter">D</span>
                <span class="opt-text">消除电源纹波并提升最大输出功率</span>
              </div>
              <span class="opt-badge">✕ 误选</span>
            </div>
            <div class="opt-exp">❌ <b>诊断</b>：<i>R</i><sub>e</sub> 会分担直流压降并减小动态摆幅，并非用于提升输出功率。</div>
          </label>
        </div>
        <div class="foot-nav">
          <span></span>

            <span class="locked-ans-txt">🔒 本题已锁定并存入本地浏览器记录</span>
            <span class="locked-unk-txt">🟧 已标为「不会」并加入本地错题本</span>
          </label>
          <span></span>
        </div>

    <div class="mistake-panel">
      <div class="mistake-title">
        <span>📒 本地错题本（自动持久化至 localStorage）</span>
        <span id="mistake-count" style="font-size:12px;color:#cbd5e1;">0 题</span>
      </div>
      <div id="mistake-empty" class="mistake-empty">当前暂无错题或「此题不会」记录，开始作答后会自动沉淀到这里。</div>
      <ul id="mistake-list" class="mistake-list"></ul>
    </div>
  </div>

  <script>
  (function() {
    const QUIZ_ID = 'stem_notes_quiz_demo_v1';
    const STORAGE_KEY = 'stem_notes_quiz_state_' + QUIZ_ID;

    let state = { nav: 'nav-q1', answers: {}, mistakes: [] };
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw && raw.startsWith('{')) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          state.nav = parsed.nav || 'nav-q1';
          state.answers = parsed.answers || {};
          state.mistakes = Array.isArray(parsed.mistakes) ? parsed.mistakes : [];
        }
      }
    } catch (e) {}

    document.querySelectorAll('label[for]').forEach(function(lbl) {
      lbl.addEventListener('mousedown', function(e) { e.preventDefault(); });
    });

    function getQuestionMeta(qName) {
      const panel = document.getElementById('panel-' + qName);
      if (!panel) return { tag: qName.toUpperCase(), excerpt: '' };
      const tagEl = panel.querySelector('.q-tag');
      const stemEl = panel.querySelector('.q-stem');
      const tag = tagEl ? tagEl.textContent.trim() : qName.toUpperCase();
      const excerpt = stemEl ? stemEl.textContent.replace(/\s+/g, ' ').trim().slice(0, 46) : '';
      return { tag: tag, excerpt: excerpt };
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function renderSummaryAndMistakes() {
      const total = document.querySelectorAll('.q-panel').length;
      let answered = 0;
      let right = 0;
      let wrongOrUnknown = 0;
      const mistakeItems = [];

      Object.keys(state.answers).sort().forEach(function(qName) {
        const entry = state.answers[qName];
        if (!entry || !entry.id) return;
        answered += 1;
        if (entry.status === 'right') {
          right += 1;
        } else {
          wrongOrUnknown += 1;
          mistakeItems.push({ qName: qName, status: entry.status, tag: entry.tag, excerpt: entry.excerpt });
        }
      });

      state.mistakes = mistakeItems;
      const summaryEl = document.getElementById('quiz-score-summary');
      if (summaryEl) {
        summaryEl.textContent = '进度 ' + answered + '/' + total + ' · 正确 ' + right + ' · 错/不会 ' + wrongOrUnknown;
      }
      const countEl = document.getElementById('mistake-count');
      if (countEl) countEl.textContent = mistakeItems.length + ' 题';

      const emptyEl = document.getElementById('mistake-empty');
      const listEl = document.getElementById('mistake-list');
      if (!listEl || !emptyEl) return;
      listEl.innerHTML = '';
      if (mistakeItems.length === 0) {
        emptyEl.style.display = 'block';
        return;
      }
      emptyEl.style.display = 'none';
      mistakeItems.forEach(function(item) {
        const li = document.createElement('li');
        li.className = 'mistake-item';
        const label = document.createElement('span');
        const prefix = item.status === 'unknown' ? '🟧 不会' : '❌ 答错';
        label.textContent = prefix + ' · ' + item.qName.toUpperCase() + ' [' + item.tag + '] ' + item.excerpt;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mistake-jump';
        btn.textContent = '跳转复盘';
        btn.addEventListener('click', function() {
          const navRadio = document.getElementById('nav-' + item.qName);
          if (navRadio) {
            navRadio.checked = true;
            state.nav = navRadio.id;
            saveState();
          }
        });
        li.appendChild(label);
        li.appendChild(btn);
        listEl.appendChild(li);
      });
    }

    function applyState() {
      const navEl = document.getElementById(state.nav);
      if (navEl) navEl.checked = true;
      Object.keys(state.answers).forEach(function(qName) {
        const entry = state.answers[qName];
        if (entry && entry.id) {
          const radio = document.getElementById(entry.id);
          if (radio) radio.checked = true;
        }
      });
      renderSummaryAndMistakes();
    }

    document.querySelectorAll('input.ans-radio').forEach(function(radio) {
      radio.addEventListener('click', function(e) {
        const prev = state.answers[this.name];
        if (prev && prev.id && prev.id !== this.id) {
          e.preventDefault();
          const prevEl = document.getElementById(prev.id);
          if (prevEl) prevEl.checked = true;
          return false;
        }
      });
      radio.addEventListener('change', function() {
        const prev = state.answers[this.name];
        if (prev && prev.id && prev.id !== this.id) {
          const prevEl = document.getElementById(prev.id);
          if (prevEl) prevEl.checked = true;
          return;
        }
        if (this.checked) {
          const status = this.classList.contains('is-right')
            ? 'right'
            : (this.classList.contains('is-unknown') ? 'unknown' : 'wrong');
          const meta = getQuestionMeta(this.name);
          state.answers[this.name] = {
            id: this.id,
            status: status,
            tag: meta.tag,
            excerpt: meta.excerpt,
            updatedAt: Date.now()
          };
          renderSummaryAndMistakes();
          saveState();
        }
      });
    });

    document.querySelectorAll('input[name="nav"]').forEach(function(radio) {
      radio.addEventListener('change', function() {
        if (this.checked) {
          state.nav = this.id;
          saveState();
        }
      });
    });

    const resetBtn = document.getElementById('btn-reset-quiz');
    if (resetBtn) {
      resetBtn.addEventListener('click', function() {
        state = { nav: 'nav-q1', answers: {}, mistakes: [] };
        document.querySelectorAll('input.ans-radio').forEach(function(r) { r.checked = false; });
        const firstNav = document.getElementById('nav-q1');
        if (firstNav) firstNav.checked = true;
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        renderSummaryAndMistakes();
      });
    }

    applyState();
  })();
  </script>
</body>
</html>
